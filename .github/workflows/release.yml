name: Release

# Packages a Windows installer and publishes it to a GitHub Release.
#
# Triggered by pushing a version tag (v0.0.1, v0.1.0, …). electron-updater in
# the application reads that same Release feed, so tagging is the whole
# publishing workflow.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The fixture-backed parser tests skip when no .eml files are present,
      # which is the case here: real mail is deliberately not in the repository.
      - name: Test
        run: npm test

  release:
    name: Build and publish Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags carry the release note, so the checkout needs them.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only meaningful for a tag push; a manual dispatch has no version tag.
      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "Releasing version $PKG"

      # 0.0.1 shipped a build whose Settings screen threw on render, blanking
      # the window. Refuse to package a build that cannot draw its own screens.
      - name: Smoke test every screen
        run: npm run smoke

      # electron-builder uploads assets in parallel, and if the release does not
      # exist yet each upload races to create it — which produced two releases
      # for the same tag, one holding the installer and the other the blockmap.
      # Creating it up front means every upload lands in the same release.
      - name: Create the release up front
        shell: bash
        run: |
          # The release note is the tag's own subject line, kept to a short
          # phrase. Anything longer belongs in the commit history, not here.
          #
          # actions/checkout leaves annotated tags as lightweight refs, and
          # reading contents:subject off one of those returns the *commit*
          # subject instead. Re-fetching the tag object restores the annotation.
          git fetch --force --tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" || true

          NOTE=$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:subject)')
          COMMIT_SUBJECT=$(git log -1 --format='%s')

          # A lightweight tag reports the commit subject; that is not a release
          # note, so fall back to the generic phrase rather than publishing it.
          if [ -z "$NOTE" ] || [ "$NOTE" = "$COMMIT_SUBJECT" ]; then
            NOTE="General improvements"
          fi
          echo "Release note: $NOTE"

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME"               --title "${GITHUB_REF_NAME#v}"               --notes "$NOTE"               --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
