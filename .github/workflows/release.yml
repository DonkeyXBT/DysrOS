name: Release

# Packages a Windows installer and publishes it to a GitHub Release.
#
# Triggered by pushing a version tag (v0.0.1, v0.1.0, …). electron-updater in
# the application reads that same Release feed, so tagging is the whole
# publishing workflow.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The fixture-backed parser tests skip when no .eml files are present,
      # which is the case here: real mail is deliberately not in the repository.
      - name: Test
        run: npm test

  release:
    name: Build and publish Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only meaningful for a tag push; a manual dispatch has no version tag.
      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "Releasing version $PKG"

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
